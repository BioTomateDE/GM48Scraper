[package]
name = "gm48-scraper"
version = "0.4.0"
authors = ["BioTomateDE <rust@biotomate.dev>"]
edition = "2024"
description = "CLI for scraping GameMaker data files from the GM48 Game Jam"
readme = "README.md"
repository = "https://codeberg.org/BioTomateDE/GM48Scraper"
license = "GPL-3.0-or-later"
keywords = ["gamemaker", "scraping", "cli"]
categories = ["command-line-utilities"]

[lints.rust]
unused_results = "warn"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
colored-print = "1.0"

# I really don't like this dependency because of its horrid
# build script, but it works flawlessly for SFX archives.
# Feel free to replace this dependency when there is Rust-native solution.
compress-tools = "0.16"

futures = "0.3"
humansize = "2.1"
reqwest = "0.13"
sanitise-file-name = "1.0"
scraper = "0.29"
tokio = { version = "1.54", features = ["fs", "macros", "rt-multi-thread"] }
urlencoding = "2.1"
